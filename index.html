<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<!-- minimum-scale=1 stops the page being pinched below 100%. Zoomed out, the
     document is sized to the layout viewport while the browser shows the larger
     visual viewport, and the difference appears as a band down the right and
     bottom with nothing in it. Zooming in is deliberately still allowed. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>Reader</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/pdf-textlayer.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="library">

<!-- ============================================================ library -->
<section id="library-view">
  <header class="bar">
    <h1>Reader</h1>
    <div class="spacer"></div>
    <button id="add" class="primary">Add books</button>
  </header>

  <input id="file" type="file" multiple hidden
         accept=".epub,.pdf,application/epub+zip,application/pdf">

  <div id="grid" class="grid"></div>

  <div id="empty" class="empty" hidden>
    <p class="big">No books yet</p>
    <p>Add an <strong>.epub</strong> or <strong>.pdf</strong> and it is stored on this
       device. Everything after that works with no connection.</p>
    <button id="add-empty" class="primary">Choose files</button>
    <p class="hint">On a computer you can also drag files anywhere onto this window.</p>
  </div>

  <footer class="usage">
    <span id="usage"></span>
    <button id="check-update" class="linkish" title="Fetch the latest version">check for update</button>
  </footer>
</section>

<!-- ============================================================= reader -->
<section id="reader-view" hidden>
  <header class="bar reader-bar">
    <button id="back" title="Back to library (Esc)">‹ Library</button>
    <h2 id="book-title"></h2>
    <div class="spacer"></div>

    <button id="toc-open" disabled title="Table of contents">Contents</button>
    <button id="hl-open" disabled title="Highlight the selected text">✎ Highlight</button>
    <button id="marks-open" disabled title="List of highlights">Highlights</button>
    <button id="search-open" disabled title="Search this book (Ctrl+F)">Search</button>
    <button id="speed-open" disabled title="Speed read from this page">Speed read</button>
    <button id="audio-open" disabled title="Add an audiobook for this book">🎧 Audio</button>

    <span class="group" role="group" aria-label="Size">
      <button id="smaller" title="Smaller">A−</button>
      <span id="scale-label" class="readout">100%</span>
      <button id="bigger" title="Larger">A+</button>
    </span>

    <!-- Populated from THEMES in js/settings.js -->
    <select id="theme" class="picker" aria-label="Colour theme"></select>

    <span id="progress-label" class="readout wide"></span>
    <button id="chrome-hide" class="chrome-toggle" title="Hide this toolbar" aria-label="Hide toolbar">⌃</button>
  </header>

  <!-- Sits at the top edge once the toolbar is hidden. -->
  <button id="chrome-show" title="Show toolbar" aria-label="Show toolbar" hidden>⌄</button>
  <!-- Beside it, when the audiobook player is tucked away as well. -->
  <button id="audio-show" title="Show the audiobook player" aria-label="Show the audiobook player" hidden>🎧</button>

  <!-- The audiobook player. Driven by js/audio-player.js. -->
  <input id="audio-file" type="file" multiple hidden>
  <div id="audio-bar" class="audio-bar" hidden>
    <button id="audio-hide" class="audio-hide" title="Hide the player (it keeps playing)" aria-label="Hide the player">⌃</button>
    <button id="audio-back" title="Back 30 seconds" aria-label="Back 30 seconds">↺30</button>
    <button id="audio-play" class="primary audio-play" title="Play" aria-label="Play">▶</button>
    <button id="audio-fwd" title="Forward 30 seconds" aria-label="Forward 30 seconds">30↻</button>
    <span id="audio-time" class="audio-time">0:00</span>
    <input id="audio-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in the audiobook">
    <span id="audio-left" class="audio-time"></span>
    <span id="audio-track" class="audio-time" hidden></span>
    <select id="audio-rate" class="picker audio-rate" aria-label="Playback speed" title="Playback speed"></select>
    <button id="audio-more" title="Tracks, replace or remove" aria-label="Audiobook tracks and options">⋯</button>
  </div>

  <div class="stage">
    <div id="viewer"></div>

    <!-- Tap targets for touch. The middle of the page stays free so text can
         still be selected. -->
    <button id="tap-prev" class="tap left"  aria-label="Previous page"></button>
    <button id="tap-next" class="tap right" aria-label="Next page"></button>

    <!-- Visible arrows, for a mouse. -->
    <button id="prev" class="arrow left"  aria-label="Previous page">‹</button>
    <button id="next" class="arrow right" aria-label="Next page">›</button>

    <!-- Shown after following a link out of the text, e.g. to the endnotes. -->
    <button id="nav-back" hidden>‹ Back</button>

    <!-- Footnote text, pulled in without leaving the page. -->
    <aside id="note" hidden>
      <div class="note-head">
        <strong>Note</strong>
        <div class="spacer"></div>
        <button id="note-open" hidden title="Open the full note">Read in full</button>
        <button id="note-close" aria-label="Close note">×</button>
      </div>
      <div id="note-body"></div>
    </aside>

    <aside id="toc" class="drawer" hidden>
      <div class="drawer-head">
        <strong>Contents</strong>
        <button data-close="toc" aria-label="Close contents">×</button>
      </div>
      <nav id="toc-list" class="drawer-body"></nav>
    </aside>

    <aside id="marks" class="drawer" hidden>
      <div class="drawer-head">
        <strong>Highlights</strong>
        <button data-close="marks" aria-label="Close highlights">×</button>
      </div>
      <div id="marks-list" class="drawer-body"></div>
    </aside>

    <aside id="audio" class="drawer" hidden>
      <div class="drawer-head">
        <strong>Audiobook</strong>
        <button data-close="audio" aria-label="Close audiobook panel">×</button>
      </div>
      <p id="audio-summary" class="audio-summary"></p>
      <div id="audio-tracks" class="drawer-body"></div>
      <div class="audio-actions">
        <button id="audio-replace">Replace audiobook…</button>
        <button id="audio-remove">Remove audiobook</button>
      </div>
    </aside>

    <aside id="search" class="drawer" hidden>
      <div class="drawer-head">
        <strong>Search</strong>
        <button data-close="search" aria-label="Close search">×</button>
      </div>
      <form id="search-form" class="search-form">
        <input id="search-input" type="search" placeholder="Word or phrase"
               autocomplete="off" spellcheck="false" aria-label="Search this book">
        <button type="submit" class="primary">Go</button>
      </form>
      <p id="search-status" class="search-status"></p>
      <div id="search-results" class="drawer-body"></div>
    </aside>
  </div>

  <div class="reader-progress-track"><span id="reader-progress"></span></div>
</section>

<!-- Speed reading: one word at a time, from wherever you are. Driven by
     js/speed-read.js; the engines only supply the words. -->
<section id="rsvp" hidden aria-label="Speed read" tabindex="-1">
  <header class="rsvp-bar">
    <button id="rsvp-done" title="Back to the page (Esc)">‹ Done</button>
    <div class="spacer"></div>
    <span id="rsvp-where" class="rsvp-where"></span>
  </header>

  <div id="rsvp-stage" class="rsvp-stage">
    <div class="rsvp-frame">
      <div class="rsvp-word"><span id="rsvp-pre"></span><span id="rsvp-pivot" class="rsvp-pivot"></span><span id="rsvp-post"></span></div>
    </div>
    <p id="rsvp-context" class="rsvp-context"></p>
    <p id="rsvp-hint" class="rsvp-hint"></p>
  </div>

  <footer class="rsvp-controls">
    <button id="rsvp-back" title="Back a sentence (←)" aria-label="Back a sentence">«</button>
    <button id="rsvp-play" class="primary rsvp-play">Play</button>
    <button id="rsvp-fwd" title="Forward a sentence (→)" aria-label="Forward a sentence">»</button>
    <span class="group rsvp-speed" role="group" aria-label="Speed">
      <button id="rsvp-slower" title="Slower (↓)" aria-label="Slower">−</button>
      <span id="rsvp-wpm" class="readout">300 wpm</span>
      <button id="rsvp-faster" title="Faster (↑)" aria-label="Faster">+</button>
    </span>
  </footer>
</section>

<!-- Appears over the text when you select something in an epub. -->
<div id="hl-toolbar" hidden>
  <span id="hl-colors" class="hl-colors"></span>
  <button id="hl-remove" hidden title="Remove highlight">Remove</button>
</div>

<p id="status" class="status" hidden></p>

<!-- Only with ?debug in the URL. Reading these numbers off a photograph is
     far quicker than guessing at someone else's device. -->
<pre id="debug" hidden></pre>

<!-- epub.js is a classic script and expects JSZip as a global, so both load
     the old-fashioned way. pdf.js is a module and is imported on demand by
     js/pdf-engine.js, so opening an epub never downloads it. -->
<script src="lib/jszip.min.js"></script>
<script src="lib/epub.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
